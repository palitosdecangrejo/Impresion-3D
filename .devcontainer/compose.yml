services:
  backend:
    image: node:24
    working_dir: /workspace

    volumes:
      - ..:/workspace
      - node_modules:/workspace/node_modules

    ports:
      - "3000:3000"

    command: sleep infinity

    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: app
      DB_PASSWORD: app
      DB_NAME: app

    depends_on:
      - db

  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "3306:3306"

volumes:
  node_modules:
  mysql_data: